<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Work In Progress - Poco X5 Pro 5G</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #181a20;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      width: 100%;
      background: #22242a;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      padding: 40px 30px;
      gap: 40px;
    }
    .content {
      flex: 1;
    }
    .content h1 {
      font-size: 2.8rem;
      margin-bottom: 0.5em;
      color: #ffe600;
    }
    .content p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 1.5em;
    }
    .device-img {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .device-img img {
      max-width: 260px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(255,230,0,0.2);
      border: 3px solid #ffe600;
      background: #fff;
    }
    .timer {
      font-size: 2rem;
      font-weight: bold;
      color: #ffe600;
      margin-bottom: 1.5em;
      letter-spacing: 2px;
      text-align: left;
    }
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
        padding: 20px 10px;
        gap: 20px;
      }
      .device-img {
        justify-content: center;
      }
      .device-img img {
        max-width: 180px;
      }
      .timer {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="timer" id="timer"></div>
      <h1>🚧 Work In Progress</h1>
      <p>
        This site is under construction.<br>
        Stay tuned for updates and new features!
      </p>
      <p>
        <b>Device Highlight:</b> Poco X5 Pro 5G (Yellow)
      </p>
    </div>
    <div class="device-img">
      <img src="https://fdn2.gsmarena.com/vv/pics/xiaomi/xiaomi-poco-x5-pro-5g-1.jpg" alt="Poco X5 Pro 5G Yellow">
    </div>
  </div>
  <script>
    // Set your target date and time here (YYYY-MM-DDTHH:MM:SS)
    const targetDate = new Date("2025-07-01T12:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.getElementById("timer").innerHTML = "🚀 Launching soon!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML =
        `⏳ ${days}d ${hours}h ${minutes}m ${seconds}s left`;
    }

    updateTimer(); // Initial call
    setInterval(updateTimer, 1000); // Update every second
  </script>
</body>
</html>
